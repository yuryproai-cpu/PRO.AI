<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO Ai</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #000; overflow: hidden; }
        
        /* Сцена, где будет появляться видео */
        #stage {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        #stage video {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 0; /* Скрыто, пока не готово */
            transition: opacity 0.3s ease; /* Плавное появление */
        }
        #stage video.ready { opacity: 1; }

        /* Кнопка старта */
        #startScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.8); color: white; font-family: sans-serif;
            z-index: 10; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Сцена -->
    <div id="stage"></div>

    <!-- Кнопка старта (чтобы разблокировать звук) -->
    <div id="startScreen">
        <h1>PRO Ai</h1>
        <p>Нажмите, чтобы начать</p>
    </div>

    <!-- Подключаем наш скрипт-режиссер -->
    <script src="director.js"></script>
</body>
</html>
