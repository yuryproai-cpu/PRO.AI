<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PRO.AI</title>
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
  <div id="splash"><img src="logo.png" alt="PRO.AI"></div>

  <header id="topbar">
    <button id="menu-btn" aria-label="Меню">☰</button>
    <span id="topbar-title">PRO.AI</span>
  </header>

  <div id="menu-overlay" hidden></div>
  <nav id="menu-drawer" hidden></nav>

  <main id="app">
    <section id="screen-cabinet" class="screen">
      <div class="bento">
        <div class="glass card-profile">
          <div class="profile-left">
            <label class="avatar-ring">
              <img id="cabinet-avatar" alt="Аватар">
              <input class="avatar-input" type="file" accept="image/*" hidden>
            </label>
            <div class="profile-social">
              <span><b id="cnt-following">0</b> подписки</span>
              <span><b id="cnt-followers">0</b> подписчики</span>
            </div>
          </div>
          <div class="profile-main">
            <div class="profile-name-row">
              <span id="cabinet-name"></span>
              <span id="cabinet-role-badge" class="badge badge-admin" hidden></span>
            </div>
            <div id="cabinet-bio" class="profile-bio"></div>
            <div class="level-line">
              <span id="cabinet-level" class="level-badge"></span>
              <div class="progress"><i id="cabinet-level-progress"></i></div>
            </div>
            <div class="editors">
              <button id="btn-edit-name" class="mini-btn">✎ имя</button>
              <button id="btn-edit-bio" class="mini-btn">✎ описание</button>
            </div>
          </div>
        </div>

        <div class="glass tile" id="tile-likes">
          <div class="t-icon">❤️</div><b class="t-num" id="likes-num">0</b><span class="t-label">Лайки</span>
        </div>
        <div class="glass tile" id="tile-awards">
          <div class="t-icon">🏆</div><b class="t-num" id="awards-num">0</b><span class="t-label">Трофеи</span>
        </div>
        <div class="glass tile" id="tile-level">
          <div class="t-icon">⭐</div><b class="t-num" id="level-num">1</b><span class="t-label">Уровень</span>
        </div>

        <div class="glass tile" id="tile-games">
          <div class="t-icon">🎮</div><b class="t-num" id="games-num">0</b><span class="t-label">Мои заявки</span>
        </div>
        <div class="glass tile t-btn" id="tile-stats">
          <div class="t-icon">📊</div><span class="t-label">Статистика</span>
        </div>
        <div class="glass tile" id="tile-learn">
          <div class="t-icon">📖</div><b class="t-num" id="learn-num">1</b><span class="t-label">Обучение</span>
        </div>

        <div class="glass tile" id="tile-xp">
          <div class="t-icon">🔥</div><b class="t-num" id="xp-num">0</b><span class="t-label">Опыт</span>
          <div class="progress"><i id="xp-progress"></i></div>
        </div>
        <div class="glass tile" id="tile-rating">
          <div class="t-icon">💠</div><b class="t-num" id="rating-num">—</b><span class="t-label">Рейтинг</span>
        </div>
        <div class="glass tile" id="tile-chats">
          <div class="t-icon">💬</div><span class="t-label">Чаты — скоро</span>
        </div>

        <div class="glass card-friends">
          <div class="card-title">Друзья</div>
          <div id="friends-list"><p class="muted">Загрузка…</p></div>
        </div>

        <div class="glass card-full" id="hall-banner">🏅 Зал славы — скоро</div>
      </div>
    </section>

    <section id="screen-manage" class="screen" hidden>
      <button id="manage-back" class="btn btn-secondary" style="margin-bottom:12px">← Назад в кабинет</button>
      <div id="manage-body"></div>
    </section>

    <section id="screen-users" class="screen" hidden>
      <button id="users-back" class="btn btn-secondary" style="margin-bottom:12px">← Назад в кабинет</button>
      <div id="users-detail" hidden></div>
      <div id="users-list"></div>
    </section>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="js/firebase.js?v=18"></script>
  <script src="js/logo.js?v=18"></script>
  <script src="js/account.js?v=18"></script>
  <script src="js/games-catalog.js?v=18"></script>
  <script src="js/app.js?v=18"></script>
</body>
</html>
