<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PRO.AI</title>
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <div id="splash"><img src="logo.png" alt="PRO.AI"></div>

  <main id="app">
    <section id="screen-lobby" class="screen">
      <div class="profile-card">
        <label class="profile-avatar">
          <img alt="Аватар">
          <input class="avatar-input" type="file" accept="image/*" hidden>
        </label>
        <div class="profile-text">
          <span class="profile-name"></span>
          <button class="profile-name-edit" hidden>✎ Указать имя</button>
          <p class="profile-bio"></p>
        </div>
      </div>
    </section>
    <section id="screen-games" class="screen" hidden></section>
    <section id="screen-learn" class="screen" hidden></section>
    <section id="screen-chat" class="screen" hidden></section>
    <section id="screen-settings" class="screen" hidden></section>
  </main>

  <nav id="tabbar"></nav>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js?v=12"></script>
  <script src="js/logo.js?v=12"></script>
  <script src="js/account.js?v=12"></script>
  <script src="js/app.js?v=12"></script>
</body>
</html>
